name: iOS Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-xcodeproj:
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Xcode Cloud (configured from App Store Connect, not Xcode itself, so it works
      # without a local Mac) needs a real .xcodeproj sitting in the repo to detect a
      # scheme when you set up a workflow — it can't run our generation step first the
      # way build-and-test does. So CI regenerates the project and commits it back
      # whenever project.yml or the source tree changes.
      - name: Commit regenerated project if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NoobIncremental.xcodeproj
          if git diff --cached --quiet; then
            echo "No changes to NoobIncremental.xcodeproj"
          else
            git commit -m "chore: sync generated Xcode project [skip ci]"
            git push
          fi

  build-and-test:
    needs: sync-xcodeproj
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: destination
        run: |
          NAME=$(xcrun simctl list devices available \
            | grep -m1 -E '^[[:space:]]+iPhone' \
            | sed -E 's/^[[:space:]]+//; s/ \(.*//')
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild test \
            -project NoobIncremental.xcodeproj \
            -scheme NoobIncremental \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.name }}"

  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # No Apple Developer account/signing certs exist in CI, so this builds a plain
      # unsigned .app for a real device and hand-packages it into an .ipa. Sideloadly
      # strips/re-signs it locally with your free Apple ID — it doesn't need CI to sign it.
      - name: Build unsigned .app for iOS device
        run: |
          xcodebuild build \
            -project NoobIncremental.xcodeproj \
            -scheme NoobIncremental \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      # Uses `ditto`, not `zip` — plain zip doesn't reliably preserve the executable bit
      # on the app's binary inside the bundle, which makes installers reject the .ipa
      # as invalid. `ditto` is what `xcodebuild -exportArchive` itself uses internally.
      - name: Package as .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/NoobIncremental.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          chmod +x "Payload/NoobIncremental.app/NoobIncremental"
          ditto -c -k --keepParent Payload NoobIncremental-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoobIncremental-unsigned-ipa
          path: NoobIncremental-unsigned.ipa
          retention-days: 30
