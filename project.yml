name: NoobIncremental

options:
  bundleIdPrefix: com.taragod.noobincremental
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0

targets:
  NoobIncremental:
    type: application
    platform: iOS
    sources:
      - path: Sources/NoobIncremental
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: Sources/NoobIncremental/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Google's public TEST app ID — swap for your own after creating an AdMob account.
        # See Sources/NoobIncremental/Systems/RewardedAdManager.swift for details.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taragod.noobincremental
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets:
        - NoobIncrementalTests
      gatherCoverageData: true

  NoobIncrementalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NoobIncrementalTests
    dependencies:
      - target: NoobIncremental
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
